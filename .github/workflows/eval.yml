name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_eval:
        description: Run live reference checks against Gemini
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m pytest -q
      - run: python -m app.eval.run_eval

  live-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.live_eval
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -c "from app.config import api_key; api_key()"
      - name: Evaluate pinned reference questions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m app.eval.run_eval --live
