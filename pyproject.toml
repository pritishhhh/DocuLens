[project]
name = "doculens"
version = "1.0.0"
description = "Evidence-grounded question answering over SEC filings"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.2",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
